name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Prepare Android project
        run: |
          set -e
          newest() { for x in $1; do echo "$(git log -1 --format=%ct -- "$x") $x"; done | sort -n | tail -1 | cut -d' ' -f2-; }
          ZIP=$(newest "project*.zip")
          HTML=$(newest "index*.html")
          echo "Using: $ZIP and $HTML"
          unzip -q -o "$ZIP" -d .
          mkdir -p app/src/main/assets
          cp "$HTML" app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DailyAccessories-APK
          path: app/build/outputs/apk/debug/app-debug.apk
